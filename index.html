<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Winnow reads a creator's brand inbox and tells them what each email is, what the deal says, what is risky, and what to do next." />
    <title>Winnow — brand deal inbox</title>
    <script>
      // Follow the system theme until the creator chooses one. No white flash on load.
      try {
        var stored = localStorage.getItem('winnow-theme')
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
